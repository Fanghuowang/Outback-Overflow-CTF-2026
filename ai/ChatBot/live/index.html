<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatBot</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --me:#2b5cff; --bot:#262a33; --fg:#e8eaf0; --dim:#8a90a0; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #262a33; }
  header h1 { margin:0; font-size:18px; } header p { margin:2px 0 0; color:var(--dim); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;
         max-width:760px; width:100%; margin:0 auto; }
  .m { padding:10px 14px; border-radius:14px; max-width:80%; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); } .bot { align-self:flex-start; background:var(--bot); }
  .sys { align-self:center; color:var(--dim); font-size:13px; }
  form { display:flex; gap:8px; padding:14px; max-width:760px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:56px; padding:10px; border-radius:10px; border:1px solid #333a46;
             background:var(--panel); color:var(--fg); font:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--me); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #count { color:var(--dim); font-size:12px; text-align:right; max-width:760px; width:100%; margin:-8px auto 8px; padding:0 14px; }
</style>
</head>
<body>
<header>
  <h1>🤖 ChatBot</h1>
  <p>Super secure. Really good at hiding flags. Each message is answered on its own: ChatBot has no memory of earlier messages.</p>
</header>
<div id="log"><div class="m bot">Hi! I'm ChatBot. Ask me anything!</div></div>
<form id="f">
  <textarea id="t" maxlength="500" placeholder="Type a message… (Enter to send)"></textarea>
  <button id="b">Send</button>
</form>
<div id="count">0 / 500</div>
<script>
const log = document.getElementById('log'), t = document.getElementById('t'),
      b = document.getElementById('b'), count = document.getElementById('count');
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
t.addEventListener('input', () => count.textContent = t.value.length + ' / 500');
t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); send(); });
async function send() {
  const message = t.value.trim(); if (!message || b.disabled) return;
  add('me', message); t.value = ''; count.textContent = '0 / 500'; b.disabled = true;
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({ message }) });
    const j = await r.json().catch(() => ({}));
    add(r.ok ? 'bot' : 'sys', j.reply || ('Error ' + r.status));
  } catch { add('sys', 'Network error.'); }
  b.disabled = false; t.focus();
}
</script>
</body>
</html>
